<!doctype html>
<html lang="en" data-theme="night">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Incipit</title>
    <meta name="description" content="Find your next book by how you want to feel, then get it free and legally." />
    <meta name="theme-color" content="#0c0c0d" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%230c0c0d'/%3E%3Ctext x='16' y='24' text-anchor='middle' font-family='Georgia,serif' font-size='24' fill='%23c9a45c'%3EI%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Hanken+Grotesk:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <script>
      // Set theme and language before first paint so the page never flashes the wrong one.
      (function () {
        var root = document.documentElement;
        try {
          var theme = localStorage.getItem('incipit:theme');
          if (theme === 'day' || theme === 'night') root.dataset.theme = theme;
          var lang = localStorage.getItem('incipit:lang');
          if (!lang) lang = (navigator.language || 'en').toLowerCase().indexOf('fr') === 0 ? 'fr' : 'en';
          root.lang = lang === 'fr' ? 'fr' : 'en';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
