<!doctype html>
<html lang="en" data-theme="night">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Incipit</title>
    <meta name="description" content="Find your next book by how you want to feel, then get it free and legally." />
    <!-- Proves to Google Search Console that this site is the keeper's. It is public by design, not a secret. -->
    <meta name="google-site-verification" content="Xk4jyruD6mLZASLlOefXfcJoR9-CJHDdM5fdrhzaiWo" />
    <!-- What a link to the site shows where it is shared. A book's own page (/book/<id>) has the server fill in its title, words and cover. -->
    <meta property="og:site_name" content="Incipit" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Incipit" />
    <meta property="og:description" content="Find your next book by how you want to feel, then get it free and legally." />
    <meta property="og:url" content="https://incipit.incipit.workers.dev/" />
    <meta property="og:image" content="https://incipit.incipit.workers.dev/icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Incipit" />
    <meta name="twitter:description" content="Find your next book by how you want to feel, then get it free and legally." />
    <meta name="twitter:image" content="https://incipit.incipit.workers.dev/icons/icon-512.png" />
    <meta name="theme-color" content="#0c0c0d" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%230c0c0d'/%3E%3Ctext x='16' y='24' text-anchor='middle' font-family='Georgia,serif' font-size='24' fill='%23c9a45c'%3EI%3C/text%3E%3C/svg%3E"
    />
    <!-- What lets the site be installed as an app: its name, icons and colours (public/manifest.webmanifest). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Incipit" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Monsieur+La+Doulaise&family=Cinzel+Decorative&family=Brygada+1918:ital,wght@0,400;0,500;1,400&family=Hanken+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* The load screen. It is here, not in the stylesheet, so it paints before anything else arrives. */
      #loader {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 16px;
        background: #0c0c0d;
        color: #ece8df;
        transition: opacity 0.9s ease, visibility 0s 0.9s;
      }
      [data-theme='day'] #loader {
        background: #f4f0e8;
        color: #1b1a17;
      }
      #loader[data-done] {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .loader-figure {
        font: 400 1.25rem / 1 'Brygada 1918', Georgia, serif;
        font-variant-numeric: tabular-nums lining-nums;
        letter-spacing: 0.04em;
        opacity: 0.82;
      }
      .loader-unit {
        margin-left: 0.2em;
        font-size: 0.62em;
        vertical-align: 0.38em;
        opacity: 0.6;
      }
      .loader-bar {
        position: relative;
        width: min(620px, 72vw);
        height: 1px;
        background: color-mix(in srgb, currentColor 16%, transparent);
      }
      .loader-bar::after {
        content: '';
        position: absolute;
        inset: 0;
        background: #c9a45c;
        transform: scaleX(var(--loaded, 0));
        transform-origin: left;
      }
      [data-theme='day'] .loader-bar::after {
        background: #7a1f2b;
      }
    </style>
    <script src="/boot/theme.js"></script>
  </head>
  <body>
    <div id="loader" role="status" aria-label="Loading">
      <span class="loader-figure" aria-hidden="true"><span class="loader-count">0</span><span class="loader-unit">%</span></span>
      <span class="loader-bar" aria-hidden="true"></span>
    </div>
    <script src="/boot/loader.js"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
